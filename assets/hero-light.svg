<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-label="Umar Alimov — Alimov77">
  <defs>
    <pattern id="hero-grid-light" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#e4e4e7"/>
    </pattern>
    <clipPath id="hero-clip-light">
      <rect width="880" height="216" rx="14"/>
    </clipPath>
    <style>
      @keyframes slowSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes reverseSpin {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .orbit-a { transform-origin: 748px 118px; animation: slowSpin 42s linear infinite; }
      .orbit-b { transform-origin: 748px 118px; animation: reverseSpin 64s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#hero-clip-light)">
