<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 110" width="100%" height="110" fill="none">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: url(#aurora-grad);
      letter-spacing: 0.2px;
    }
    @keyframes wave-shift {
      0%, 100% { stop-color: #a855f7; }
      50% { stop-color: #ec4899; }
    }
  </style>

  <defs>
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#38bdf8;#a855f7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#a855f7;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <text x="50%" y="46" text-anchor="middle" class="title">Hi, I'm Umar Alimov 👋</text>
  <text x="50%" y="84" text-anchor="middle" class="subtitle">Frontend &amp; Full-Stack Developer • Creator of NexoreUI</text>
</svg>
